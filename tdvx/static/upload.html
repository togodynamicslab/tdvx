<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDvX — File Transcription</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,.5);
            border: 1px solid #334155;
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: #0f172a;
            border-bottom: 2px solid #22d3ee;
            color: #f8fafc;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left h1 { font-size: 20px; font-weight: 700; color: #22d3ee; letter-spacing: .5px; }
        .header-left p  { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .nav-links {
            padding: 12px 32px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 12px;
        }
        .nav-links a {
            text-decoration: none; color: #94a3b8; font-weight: 500;
            padding: 8px 16px; border-radius: 6px; transition: all .2s;
            font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
        }
        .nav-links a:hover { background: #334155; color: #22d3ee; }
        .nav-links a.active { background: rgba(34,211,238,.1); color: #22d3ee; border: 1px solid #22d3ee; }

        .content { padding: 32px; }

        .upload-area {
            border: 2px dashed #475569; border-radius: 8px;
            padding: 60px; text-align: center; cursor: pointer;
            transition: all .2s; margin-bottom: 24px; background: #0f172a;
        }
        .upload-area:hover, .upload-area.dragover {
            background: #1a2332; border-color: #22d3ee; border-style: solid;
        }
        .upload-icon { font-size: 64px; margin-bottom: 20px; color: #64748b; }
        .upload-text { font-size: 16px; color: #e2e8f0; margin-bottom: 10px; font-weight: 600; }
        .upload-hint { font-size: 12px; color: #94a3b8; letter-spacing: .5px; }

        #fileInput { display: none; }

        .file-info {
            display: none; background: #0f172a; border: 1px solid #334155;
            padding: 20px; border-radius: 8px; margin-bottom: 20px;
        }
        .file-info.show { display: block; }
        .file-name { font-weight: 600; color: #22d3ee; margin-bottom: 10px; font-size: 14px; }
        .progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; background: #22d3ee; width: 0%; transition: width .3s; }
        .progress-text { font-size: 12px; color: #94a3b8; letter-spacing: .5px; }

        .transcribe-btn {
            background: #22d3ee; color: #0f172a; border: 1px solid #22d3ee;
            padding: 14px 32px; border-radius: 6px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all .2s; display: none;
            letter-spacing: .5px; text-transform: uppercase;
        }
        .transcribe-btn.show { display: inline-block; }
        .transcribe-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,211,238,.3); background: #06b6d4; }
        .transcribe-btn:disabled { background: #334155; color: #64748b; border-color: #334155; cursor: not-allowed; transform: none; }

        .results { display: none; margin-top: 30px; }
        .results.show { display: block; }
        .results-header { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: #22d3ee; letter-spacing: .5px; text-transform: uppercase; }

        .metadata {
            background: #0f172a; border: 1px solid #334155; padding: 20px;
            border-radius: 8px; margin-bottom: 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px;
        }
        .metadata-item { display: flex; flex-direction: column; }
        .metadata-label { font-size: 10px; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .metadata-value { font-weight: 600; color: #e2e8f0; font-size: 16px; }

        /* Finetuning banner */
        .finetuning-banner {
            display: none; background: rgba(34,211,238,.05); border: 1px solid #22d3ee;
            border-radius: 8px; padding: 14px 20px; margin-bottom: 20px;
            font-size: 12px; color: #22d3ee; letter-spacing: .5px;
        }
        .finetuning-banner.show { display: flex; align-items: center; gap: 10px; }
        .finetuning-banner strong { font-weight: 700; }

        .transcript-item {
            background: #0f172a; border: 1px solid #334155; border-radius: 8px;
            padding: 18px; margin-bottom: 12px; transition: all .2s;
        }
        .transcript-item:hover { border-color: #475569; background: #1a2332; }

        .speaker-badge {
            display: inline-block; padding: 4px 10px; border-radius: 4px;
            font-size: 11px; font-weight: 700; margin-bottom: 10px;
            letter-spacing: .5px; text-transform: uppercase;
        }
        .speaker-0 { background:#1e40af; color:#93c5fd; border:1px solid #3b82f6; }
        .speaker-1 { background:#7c2d12; color:#fdba74; border:1px solid #f97316; }
        .speaker-2 { background:#064e3b; color:#6ee7b7; border:1px solid #10b981; }
        .speaker-3 { background:#831843; color:#f9a8d4; border:1px solid #ec4899; }
        .speaker-4 { background:#713f12; color:#fde047; border:1px solid #eab308; }
        .speaker-5 { background:#4c1d95; color:#c4b5fd; border:1px solid #8b5cf6; }
        .speaker-6 { background:#083344; color:#67e8f9; border:1px solid #06b6d4; }
        .speaker-7 { background:#7f1d1d; color:#fca5a5; border:1px solid #ef4444; }
        .speaker-8 { background:#365314; color:#bef264; border:1px solid #84cc16; }
        .speaker-9 { background:#1e1b4b; color:#a5b4fc; border:1px solid #6366f1; }

        .timestamp { font-size: 10px; color: #64748b; margin-bottom: 10px; font-family: 'Courier New', monospace; }
        .transcript-text { font-size: 14px; line-height: 1.8; color: #e2e8f0; margin-bottom: 10px; }
        .confidence { font-size: 10px; color: #475569; }

        .error-message {
            background: rgba(239,68,68,.1); color: #ef4444; border: 1px solid #ef4444;
            padding: 15px; border-radius: 8px; margin-top: 20px; display: none; font-size: 13px;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <h1>// FILE TRANSCRIPTION</h1>
            <p>Upload áudio · Transcrição + Diarização + Dataset</p>
        </div>
    </div>

    <div class="nav-links">
        <a href="/upload.html" class="active">File Upload</a>
        <a href="/live">Live Transcription</a>
        <a href="/finetuning/stats" target="_blank">Dataset Stats</a>
    </div>

    <div class="content">
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Clique ou arraste o arquivo de áudio aqui</div>
            <div class="upload-hint">WAV · MP3 · M4A · FLAC · OGG — máx 100 MB</div>
        </div>

        <input type="file" id="fileInput" accept="audio/*">

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">Pronto para transcrever</div>
        </div>

        <button class="transcribe-btn" id="transcribeBtn">Transcrever Áudio</button>

        <div class="error-message" id="errorMessage"></div>

        <div class="results" id="results">
            <div class="results-header">Resultado da Transcrição</div>

            <div class="metadata" id="metadata"></div>

            <div class="finetuning-banner" id="finetuningBanner">
                <span>💾</span>
                <span id="finetuningText"></span>
            </div>

            <div id="transcript"></div>
        </div>
    </div>
</div>

<script>
    const uploadArea    = document.getElementById('uploadArea');
    const fileInput     = document.getElementById('fileInput');
    const fileInfo      = document.getElementById('fileInfo');
    const fileName      = document.getElementById('fileName');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const progressFill  = document.getElementById('progressFill');
    const progressText  = document.getElementById('progressText');
    const results       = document.getElementById('results');
    const metadata      = document.getElementById('metadata');
    const transcript    = document.getElementById('transcript');
    const errorMessage  = document.getElementById('errorMessage');
    const finetuningBanner = document.getElementById('finetuningBanner');
    const finetuningText   = document.getElementById('finetuningText');

    let selectedFile = null;

    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });

    function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('audio/')) { showError('Selecione um arquivo de áudio'); return; }
        if (file.size > 100 * 1024 * 1024) { showError('Arquivo excede 100 MB'); return; }
        selectedFile = file;
        fileName.textContent = file.name + ' (' + formatSize(file.size) + ')';
        fileInfo.classList.add('show');
        transcribeBtn.classList.add('show');
        results.classList.remove('show');
        finetuningBanner.classList.remove('show');
        hideError();
    }

    function formatSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
        return (b/(1024*1024)).toFixed(1) + ' MB';
    }

    function showError(msg) { errorMessage.textContent = msg; errorMessage.classList.add('show'); }
    function hideError()    { errorMessage.classList.remove('show'); }

    transcribeBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        transcribeBtn.disabled = true;
        progressFill.style.width = '0%';
        progressText.textContent = 'Enviando...';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', e => {
                if (e.lengthComputable) {
                    const pct = (e.loaded / e.total * 100).toFixed(0);
                    progressFill.style.width = pct + '%';
                    progressText.textContent = 'Enviando... ' + pct + '%';
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    displayResults(data);
                    progressText.textContent = 'Concluído!';
                    progressFill.style.width = '100%';
                } else {
                    const err = JSON.parse(xhr.responseText);
                    showError(err.detail || 'Falha na transcrição');
                    progressText.textContent = 'Erro';
                    progressFill.style.width = '0%';
                }
                transcribeBtn.disabled = false;
            });

            xhr.addEventListener('error', () => {
                showError('Erro de rede');
                progressText.textContent = 'Erro';
                progressFill.style.width = '0%';
                transcribeBtn.disabled = false;
            });

            xhr.open('POST', '/transcribe');
            xhr.send(formData);
            progressText.textContent = 'Processando áudio...';

        } catch (err) {
            showError('Erro: ' + err.message);
            transcribeBtn.disabled = false;
        }
    });

    function displayResults(data) {
        // Metadata
        const speakers = new Set(data.segments.map(s => s.speaker)).size;
        metadata.innerHTML = `
            <div class="metadata-item">
                <div class="metadata-label">Idioma</div>
                <div class="metadata-value">${langName(data.language)}</div>
            </div>
            <div class="metadata-item">
                <div class="metadata-label">Duração</div>
                <div class="metadata-value">${data.duration ? data.duration.toFixed(1) + 's' : '—'}</div>
            </div>
            <div class="metadata-item">
                <div class="metadata-label">Segmentos</div>
                <div class="metadata-value">${data.segments.length}</div>
            </div>
            <div class="metadata-item">
                <div class="metadata-label">Speakers</div>
                <div class="metadata-value">${speakers}</div>
            </div>
        `;

        // Finetuning banner
        if (data.finetuning && data.finetuning.entries_saved > 0) {
            finetuningText.innerHTML = `<strong>${data.finetuning.entries_saved}</strong> segmentos salvos no dataset &nbsp;·&nbsp; sessão <code>${data.finetuning.session_id}</code>`;
            finetuningBanner.classList.add('show');
        }

        // Transcript
        transcript.innerHTML = data.segments.map(seg => {
            const num = parseInt(seg.speaker.replace(/\D/g, '')) || 0;
            const cls = 'speaker-' + (num % 10);
            const conf = (seg.confidence * 100).toFixed(0);
            return `
                <div class="transcript-item">
                    <div class="speaker-badge ${cls}">${seg.speaker}</div>
                    <div class="timestamp">${fmtTime(seg.start)} — ${fmtTime(seg.end)}</div>
                    <div class="transcript-text">${seg.text}</div>
                    <div class="confidence">confiança: ${conf}%</div>
                </div>
            `;
        }).join('');

        results.classList.add('show');
    }

    function langName(code) {
        const map = { pt:'Português', en:'English', es:'Español', fr:'Français', de:'Deutsch', it:'Italiano', ja:'日本語', ko:'한국어', zh:'中文', unknown:'—' };
        return map[code] || (code || '—').toUpperCase();
    }

    function fmtTime(s) {
        const m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return m + ':' + String(sec).padStart(2, '0');
    }
</script>
</body>
</html>
