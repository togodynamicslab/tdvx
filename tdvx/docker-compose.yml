version: '3.8'

services:
  tdvx:
    build: .
    container_name: tdvx-transcription
    ports:
      - "8000:8000"
    environment:
      - PYANNOTE_AUTH_TOKEN=${PYANNOTE_AUTH_TOKEN}
      - HOST=0.0.0.0
      - PORT=8000
      - DEFAULT_MODEL=tdv1-fast
      - ENABLE_DIARIZATION=true
      - ENABLE_TDV1=true
      - ENABLE_TDV1_BALANCED=true
      - ENABLE_TDV1_FAST=true
      - CHUNK_DURATION_SECONDS=10.0
      - PYANNOTE_MIN_SPEAKERS=1
      - PYANNOTE_MAX_SPEAKERS=10
      - PYANNOTE_CLUSTERING_THRESHOLD=0.5
      - PYANNOTE_LIVE_CLUSTERING_THRESHOLD=0.65
      # MLflow connection for fine-tuning
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_FINETUNE_EXPERIMENT=tdv1-finetune
    volumes:
      - model_cache:/root/.cache
      - ./finetuning_data:/app/finetuning_data
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tdvx-network
    depends_on:
      - mlflow

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: tdvx-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow123}@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
      - MLFLOW_SERVE_ARTIFACTS=true
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./models:/mlflow/models
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD:-mlflow123}@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
    restart: unless-stopped
    networks:
      - tdvx-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL Database for MLflow
  postgres:
    image: postgres:15-alpine
    container_name: tdvx-mlflow-db
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD:-mlflow123}
      - POSTGRES_DB=mlflow
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tdvx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgAdmin - Web UI para gerenciar PostgreSQL (opcional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tdvx-pgadmin
    profiles:
      - tools
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@tdvx.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - tdvx-network
    depends_on:
      - postgres

networks:
  tdvx-network:
    driver: bridge

volumes:
  model_cache:
    driver: local
  mlflow_artifacts:
    driver: local
  mlflow_db:
    driver: local
  pgadmin_data:
    driver: local
